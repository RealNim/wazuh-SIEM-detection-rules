<!-- Domain controller agent log sources. Merge into the agent ossec.conf.
     The Security channel is filtered by event ID because an unfiltered domain
     controller floods the manager with 4768 and 4769 records. -->

<localfile>
  <location>Security</location>
  <log_format>eventchannel</log_format>
  <query>Event/System[EventID=4624 or EventID=4625 or EventID=4662 or
    EventID=4720 or EventID=4724 or EventID=4726 or EventID=4728 or
    EventID=4729 or EventID=4732 or EventID=4733 or EventID=4740 or
    EventID=4756 or EventID=4757 or EventID=4768 or EventID=4769 or
    EventID=4771 or EventID=4794 or EventID=5136 or EventID=1102]</query>
</localfile>

<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
