<!-- Oracle agent log sources. Merge into /var/ossec/etc/ossec.conf
     Replace [DB_NAME], [SID] and [hostname] with the values for the instance.
     Confirm the paths with:
       SELECT value FROM v$diag_info WHERE name = 'Diag Trace';
       SHOW PARAMETER audit_file_dest; -->

<localfile>
  <log_format>syslog</log_format>
  <location>/u01/app/oracle/diag/rdbms/[DB_NAME]/[SID]/trace/alert_[SID].log</location>
</localfile>

<localfile>
  <log_format>syslog</log_format>
  <location>/u01/app/oracle/admin/[SID]/adump/*.aud</location>
</localfile>

<localfile>
  <log_format>syslog</log_format>
  <location>/u01/app/oracle/diag/tnslsnr/[hostname]/listener/trace/listener.log</location>
</localfile>
