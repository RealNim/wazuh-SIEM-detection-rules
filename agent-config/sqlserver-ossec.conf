<!-- SQL Server 2016 agent log sources. Merge into the agent ossec.conf.
     MSSQL13.MSSQLSERVER is the default SQL Server 2016 instance directory. -->

<localfile>
  <log_format>syslog</log_format>
  <location>C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Log\ERRORLOG</location>
</localfile>

<localfile>
  <log_format>eventchannel</log_format>
  <location>Security</location>
  <query>Event/System[EventID=4624 or EventID=4625 or EventID=4672 or EventID=1102]</query>
</localfile>

<localfile>
  <log_format>syslog</log_format>
  <location>C:\Program Files\Microsoft SQL Server\MSSQL13.MSSQLSERVER\MSSQL\Log\SQLAGENT.OUT</location>
</localfile>
